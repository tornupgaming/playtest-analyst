<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Playtest Analyst</title>
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<header>
			<div class="brand"><span class="logo"></span>Playtest Analyst</div>
			<div id="session" class="session"></div>
			<!-- TUG-109: cross-build comparison banner ("4 resolved · 1 new · 1 persisting") goes here. -->
			<div id="compare" class="compare" hidden></div>
			<dl id="usage" class="usage"></dl>
		</header>
		<main>
			<section class="stage">
				<div class="player">
					<video id="video" preload="auto"></video>
				</div>
				<div class="timeline-panel">
					<div class="transport">
						<button id="play" class="play" aria-label="Play"></button>
						<span id="clock" class="clock"></span>
						<button id="mute" class="mute" aria-label="Mute"></button>
						<div id="legend" class="legend"></div>
					</div>
					<div id="timeline" class="timeline"></div>
				</div>
			</section>
			<aside class="findings-panel">
				<h2>Findings <span id="count"></span></h2>
				<ol id="findings" class="findings"></ol>
			</aside>
		</main>
		<script type="module" src="./app.ts"></script>
	</body>
</html>
